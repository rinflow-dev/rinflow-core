[package]
name = "linkcursor-core"
version = "0.1.0"
edition = "2024"
description = "Cross-platform discovery, protocol, and network I/O core for LinkCursor"
license = "MPL-2.0"
repository = "https://github.com/rinflow-dev/rinflow-core"
publish = false

[lib]
name = "linkcursor_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
base64 = "0.22"
# QUIC transport with TLS 1.3 (secure.rs, quic.rs). ring as the crypto
# provider everywhere: it builds without CMake or NASM on Windows.
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

# Network priority per connection (qos.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_QoS",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
